<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

    {% import "macro.html" as macros %}
    <link rel="stylesheet" href="/static/css/normalize.css">

    <style>
        .main-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            /* grid-template-rows: auto 1fr; */
            gap: 10px;
            flex: 1;
            min-width: 0;
            margin: 0;
            padding: 20px 30px 24px 0;
        }

        .header {
            display: flex;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: bold;
            color: #17324d;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: auto;
            grid-gap: 40px;
        }

        .form-group1 {
            grid-column: 1 / 2;
        }

        .form-group2 {
            grid-column: 2 / 3;
        }

        .form-group3 {
            grid-column: 1 / 3;
            display: flex;
            flex-direction: column;
        }

        .form-group4 {
            grid-column: 1 / 3;
            display: flex;
            flex-direction: column;
        }

        .form-group5 {
            grid-column: 1 / 3;
            display: flex;
            flex-direction: column;

        }

        .form-group6 {
            grid-column: 1 / 3;
            display: flex;
            flex-direction: column;
        }

        .form-grid input[type="text"],
        .form-grid input[type="date"],
        .form-grid select,
        .form-grid textarea {

            width: 100%;
            padding: 8px;
            border: 1px solid #69788c;
            border-radius: 10px;
        }

        .form-grid label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group3 p,
        .form-group4 p {
            font-size: 12px;
            color: #69788c;
            align-self: flex-end;
            padding-right: 10px;
        }

        .form-group5 label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .alergenos-lista {
            display: flex;

            align-items: center;
            gap: 10px;
        }

        .form-check-label:nth-child(1) {
            display: flex;
            align-items: center;
            /* gap: 10px; */
            margin: 0 20px 0 20px;
            background-color: #f3d59a;

            border-radius: 15px;
            padding: 5px 20px;
            color: #e89b2c;

        }

        .form-check-label:nth-child(1):has(input:checked) {
            background-color: #e4bc6c;

            color: #e89b2c;
        }

        .form-check-label:nth-child(2) {
            display: flex;
            align-items: center;
            /* gap: 10px; */
            margin: 0 20px 0 20px;
            background-color: #f3f4f6;

            border-radius: 15px;
            padding: 5px 20px;
            color: #1769e0;

        }

        .form-check-label:nth-child(2):has(input:checked) {
            background-color: #8aaddb;

            color: #17324d;
        }

        .form-check-label:nth-child(3) {
            display: flex;
            align-items: center;
            /* gap: 10px; */
            margin: 0 20px 0 20px;
            background-color: #f0edfd;

            border-radius: 15px;
            padding: 5px 20px;
            color: #8c6df8;

        }

        .form-check-label:nth-child(3):has(input:checked) {
            background-color: #cfc6fc;

            color: #8c6df8;
        }

        .form-check-label:nth-child(4) {
            display: flex;
            align-items: center;
            /* gap: 10px; */
            margin: 0 20px 0 20px;
            background-color: #fde5e7;

            border-radius: 15px;
            padding: 5px 20px;
            color: #f4545e;

        }

        .form-check-label:nth-child(4):has(input:checked) {
            background-color: #f8bdc2;

            color: #f4545e;
        }

        .form-check-label input {
            opacity: 0;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .form-group7 {

            display: flex;
            justify-content: flex-start;
            gap: 40px;
        }

        .form-group7 button {
            padding: 8px 35px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-group7 button[type="reset"] {
            background-color: white;
            color: #17324d;
            border: 1px solid #69788c;
        }
    </style>
</head>

<body class="flex min-h-screen bg-white text-gray-800">
    {{ macros.build_site_navigation(pages=pages, selected="Cardápio") }}

    <main class="main-container">
        {% if mensagem %}
        <p role="status">{{ mensagem }}</p>
        {% endif %}
        <header class="header">
            <h1>Novo cardápio</h1>
            <p>10/10/2026</p>
        </header>

        <form class="form-grid" action="{{ url_for('nova_cardapio') }}" method="post">
            <div class="form-group1">
                <label for="data">Data:</label>
                <input type="date" id="data" name="data" value="2026-05-10">
            </div>
            <div class="form-group2">
                <label for="refeicao">Refeição:</label>
                <select id="refeicao" name="refeicao">
                    <option value="Almoço">Almoço</option>
                    <option value="Jantar">Jantar</option>
                </select>
            </div>
            <div class="form-group3">
                <label for="alimentos">Descrição dos alimentos:</label>
                <textarea id="alimentos" maxlength="500" name="alimentos"
                    placeholder="Ex.: Arroz branco; feijão; frango grelhado; salada..."></textarea>

                <p><span id="contador">0</span>/500</p>

                <script>
                    const textarea = document.getElementById('alimentos');
                    const contador = document.getElementById('contador');

                    textarea.addEventListener('input', () => {
                        // Pega a quantidade de caracteres que já foram digitados
                        const totalDigitado = textarea.value.length;

                        // Atualiza o número na tela
                        contador.textContent = totalDigitado;
                    });
                </script>

            </div>

            <div class="form-group4">
                <label for="sobremesa">Sobremesa:</label>
                <input type="text" maxlength="150" id="sobremesa" name="sobremesa"
                    placeholder="Ex.: Laranja; banana; maçã; pudim...">
                <p><span id="contador2">0</span>/150</p>

                <script>
                    const input = document.getElementById('sobremesa');
                    const contador2 = document.getElementById('contador2');

                    input.addEventListener('input', () => {
                        // Pega a quantidade de caracteres que já foram digitados
                        const totalDigitado = input.value.length;

                        // Atualiza o número na tela
                        contador2.textContent = totalDigitado;
                    });
                </script>

            </div>

            <div class="form-group5">

                <label for="alergenos">Alérgenos:</label>
                <div class="alergenos-lista">
                    <label class="form-check-label" for="gluten">
                        <span class="preview-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-wheat preview-icon">
                                <path d="M2 22 16 8" />
                                <path
                                    d="M3.47 12.53 5 11l1.53 1.53a3.5 3.5 0 0 1 0 4.94L5 19l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z" />
                                <path
                                    d="M7.47 8.53 9 7l1.53 1.53a3.5 3.5 0 0 1 0 4.94L9 15l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z" />
                                <path
                                    d="M11.47 4.53 13 3l1.53 1.53a3.5 3.5 0 0 1 0 4.94L13 11l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z" />
                                <path d="M20 2h2v2a4 4 0 0 1-4 4h-2V6a4 4 0 0 1 4-4Z" />
                                <path
                                    d="M11.47 17.47 13 19l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L5 19l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z" />
                                <path
                                    d="M15.47 13.47 17 15l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L9 15l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z" />
                                <path
                                    d="M19.47 9.47 21 11l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L13 11l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z" />
                            </svg>
                        </span>
                        <input type="checkbox" id="gluten" name="alergenos" value="Glúten">
                        Glúten
                    </label>

                    <label class="form-check-label" for="lactose">
                        <span class="preview-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-milk preview-icon">
                                <path d="M8 2h8" />
                                <path
                                    d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2" />
                                <path d="M7 15a6.472 6.472 0 0 1 5 0 6.47 6.47 0 0 0 5 0" />
                            </svg>
                        </span>
                        <input type="checkbox" id="lactose" name="alergenos" value="Lactose">
                        Lactose
                    </label>
                    <label class="form-check-label" for="ovos">
                        <span class="preview-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-egg preview-icon">
                                <path d="M12 2C8 2 4 8 4 14a8 8 0 0 0 16 0c0-6-4-12-8-12" />
                            </svg>
                        </span>
                        <input type="checkbox" id="ovos" name="alergenos" value="Ovos">
                        Ovos
                    </label>
                    <label class="form-check-label" for="amendoim">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-nut preview-icon">
                            <path d="M12 4V2" />
                            <path
                                d="M5 10v4a7.004 7.004 0 0 0 5.277 6.787c.412.104.802.292 1.102.592L12 22l.621-.621c.3-.3.69-.488 1.102-.592A7.003 7.003 0 0 0 19 14v-4" />
                            <path
                                d="M12 4C8 4 4.5 6 4 8c-.243.97-.919 1.952-2 3 1.31-.082 1.972-.29 3-1 .54.92.982 1.356 2 2 1.452-.647 1.954-1.098 2.5-2 .595.995 1.151 1.427 2.5 2 1.31-.621 1.862-1.058 2.5-2 .629.977 1.162 1.423 2.5 2 1.209-.548 1.68-.967 2-2 1.032.916 1.683 1.157 3 1-1.297-1.036-1.758-2.03-2-3-.5-2-4-4-8-4Z" />
                        </svg>
                        <input type="checkbox" id="amendoim" name="alergenos" value="Amendoim">
                        Amendoim
                    </label>

                </div>
            </div>
            <div class="form-group6">
                <label for="observacoes">Observações:</label>
                <textarea id="observacoes" name="observacoes"></textarea>
            </div>
            <div class="form-group7">
                <button type="submit">SALVAR</button>
                <button type="reset">CANCELAR</button>
            </div>
        </form>


    </main>
</body>

</html>
