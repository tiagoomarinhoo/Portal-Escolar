<!-- macro.html -->
{% macro build_site_navigation(pages, selected) %}
<div class="w-1/4 mr-8 min-h-screen bg-gray-50 border-r border-gray-200 flex flex-col">
    <!-- Adicionando o título no topo da barra lateral -->
    <div class="p-6">
        <h1 class="text-2xl font-bold text-gray-800 leading-tight">
            PORTAL<br>ESCOLAR
        </h1>
    </div>

    <!-- Lista de Links -->
    <ul class="flex-grow mt-4">
        {% for page in pages %}
        <a href="{{page.url}}" class="block">
            <li class="text-lg pl-6 py-3 hover:bg-gray-100 transition-colors
                {% if selected == page.name %}
                    border-l-4 border-blue-500 bg-gray-200 font-semibold text-blue-700
                {% else %}
                    text-gray-600
                {% endif %}">
                {{page.name}}
            </li>
        </a>
        {% endfor %}
    </ul>
</div>
{% endmacro %}
